<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JP MERLOS PLUMBING</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <header class="nav">
    <a class="logo" href="#top" data-name>JP MERLOS PLUMBING</a>
    <nav class="nav-links">
      <a href="#services">Services</a>
      <a href="#proof">Proof</a>
      <a href="#process">Process</a>
      <a href="#contact">Contact</a>
    </nav>
    <a class="btn btn-sm" href="#contact" data-nav-cta>Call now</a>
  </header>
  <main id="top">
    <section class="hero">
      <p class="eyebrow" data-eyebrow></p>
      <h1 data-hero></h1>
      <p class="lede" data-lede></p>
      <div class="hero-cta">
        <a class="btn" href="#contact" data-cta data-cta-href>Book a visit</a>
        <a class="btn btn-ghost" href="#services" data-secondary data-secondary-href>See services</a>
      </div>
      <div class="chips" data-chips></div>
    </section>
    <section class="section" id="services">
      <p class="kicker">Services</p>
      <div class="grid" data-cards></div>
    </section>
    <section class="section proof" id="proof">
      <p class="kicker">Proof</p>
      <p data-proof></p>
      <p class="muted" data-proof-by></p>
    </section>
    <section class="section" id="process">
      <p class="kicker">How it works</p>
      <ol class="steps" data-steps></ol>
    </section>
    <section class="section contact" id="contact">
      <p class="kicker">Book a visit</p>
      <form onsubmit="event.preventDefault(); this.querySelector('[type=submit]').textContent='Got it';">
        <div class="row3">
          <label>Name <input required name="name" /></label>
          <label>Phone <input required name="phone" /></label>
          <label>Email <input type="email" name="email" /></label>
        </div>
        <label>What do you need? <textarea required rows="4" name="msg"></textarea></label>
        <button class="btn" type="submit" data-cta>Book a visit</button>
      </form>
    </section>
  </main>
  <footer>© <span data-name>JP MERLOS PLUMBING</span>. All rights reserved.</footer>
  <script src="config.js"></script>
  <script src="apply.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="motion.js"></script>
</body>
</html>
